# Tiny opt-pipeline validation: 2 geometries x 2 events, exercises the full
# generate -> parallel ddsim -> inner(brute) chain that opt_iterA uses. /srv scheme.
run_mode: generate
key4hep: {run_setup: false, setup_script: "true"}

detectors:
  scepcal:
    repo_root:      /srv/k4geo
    source_script:  /srv/k4geo/install/bin/thisk4geo.sh
    steering_file:  /srv/detector_config/IDEA_o2_v01/SteeringFile_IDEA_o2_v01.py
    compact_xml:    /srv/detector_config/IDEA_o2_v01/IDEA_o2_v01.xml
    dimensions_xml: /srv/detector_config/IDEA_o2_v01/DectDimensions_IDEA_o2_v01.xml

runtime:
  runs_dir: /srv/runs
  ddsim_executable: ddsim
  scheduler: {slurm: {cpus_per_task: 1, mem: 12G, time: "1:00:00"}}

runs:
  - name: run_slurm
    outer_loop:
      detector_label: scepcal
      seeds: {start: 0, end: 0}
      geometry:
        - {parameter: scepcal_xtal_theta_width,    values: [5.0, 6.0], unit: cm}
        - {parameter: scepcal_projective_offset_r, values: [10.0],     unit: cm}
        - {parameter: scepcal_xtal_length_f,       values: [6.0],      unit: cm}
        - {parameter: scepcal_xtal_length_r,       values: [15.0],     unit: cm}
      sim: {particles: [e-], events: 2, momentum_GeV: 1, plusminus_percent: 0, theta_min: 60, theta_max: 120}
    inner_loop:
      tree_name: events
      branches: [{name: SCEPCal_MainEdep, hit_type: SimCalorimeterHit}]
      geometry_labels:
        scepcal_xtal_theta_width: Crystal width [cm]
        scepcal_xtal_length_f: Front length [cm]
      heatmap:
        axes: [scepcal_xtal_theta_width, scepcal_xtal_length_f]
        fixed: {scepcal_projective_offset_r: 10.0, scepcal_xtal_length_r: 15.0}
      algorithm:
        name: seeded_radius_cog
        params: {branch: SCEPCal_MainEdep}
        optimize_method: brute
        brute_grid_sizes: [6, 3]
        optimize_params:
          - {name: R_cluster_mm,    label: "R [mm]",      bounds: [5.0, 200.0], plot_grid_points: 6}
          - {name: E_threshold_GeV, label: "E thr [GeV]", bounds: [0.0, 0.5],   plot_grid_points: 3}
      score: {name: snr_energy, params: {sigma0: 1.0}}
      max_events: null
