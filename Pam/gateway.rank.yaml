# Model ranking: rank → model name + budget
# Based on 290-run benchmark (always_young/RD 2026-04): success rate, token efficiency, latency
# rank 0-4 = tool-capable tiers, rank -2 = reasoning-only
# budget: max API calls per run (-1 = unlimited)
# thinkable: if true, driver can enable chain-of-thought reasoning
#
# Currently focused on gemma4 only — other models commented out. Re-enable any
# of them in tandem with the corresponding entry in gateway.model.yaml.

models:
  # rank 3: top-tier premium
  # - rank: 3
  #   name: claude-opus
  #   budget: 0
  #   thinkable: true
  #   max_thinking_budget: 128000
  #   max_tokens: 32000

  # rank 2: all candidates active for one-at-a-time benchmarking. Pin per-task
  # via ForceModel: in task .md files, OR comment out all but the one being
  # tested. Final ranks will be re-assigned after benchmark results are in.
  # Flash variants bake thinking into the gateway alias via reasoning_effort,
  # so thinkable: false (driver's Anthropic-style thinking_budget path is
  # bypassed — thinking happens at gateway via extra_body.reasoning_effort).
  - rank: 2
    name: gemma4
    budget: -1
    thinkable: false   # 31b dense, Ollama Cloud, 42/42 sci bench validated  ← currently active
  - rank: 2
    name: gemma4-thinking
    budget: -1
    thinkable: true    # gemma4 with native think:true (binary, no effort tier)
