general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  background_health_checks: true
  health_check_interval: 300

router_settings:
  routing_strategy: least-busy
  num_retries: 20
  retry_after: 1
  allowed_fails: 5
  cooldown_time: 5
  enable_pre_call_checks: true
  retry_policy:
    RateLimitError: 5
    AuthenticationError: 0

litellm_settings:
  modify_params: true
  request_timeout: 300
