# Gateway model config (LiteLLM)
#
# Active models are uncommented. To add a model: uncomment or copy a template,
# set the api_key env var in .secret.sh, restart gateway.
#
# Model names here must match gateway.rank.yaml entries for Pam selection.
# Multiple deployments with the same model_name = load-balanced group.
#
# Backups: gateway.model.yaml.ollama-backup, gateway.model.yaml.venice-backup

model_list:

  # ══════════════════════════════════════════════════════════════════
  # ACTIVE — Ollama Cloud (gemma4)
  # ══════════════════════════════════════════════════════════════════

  # ── gemma4 (non-thinking) ──
  - model_name: gemma4
    litellm_params:
      model: openai/gemma4:31b-cloud
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
      keep_alive: "30m"
      max_parallel_requests: 6

  # ── gemma4-thinking (native think:true via /api/chat) ──
  - model_name: gemma4-thinking
    litellm_params:
      model: ollama_chat/gemma4:31b-cloud
      api_base: https://ollama.com
      api_key: os.environ/OLLAMA_API_KEY
      keep_alive: "30m"
      max_parallel_requests: 6
      extra_body:
        think: true

  # ── fallback (same as gemma4, used when rank.yaml exhausted) ──
  - model_name: fallback
    litellm_params:
      model: openai/gemma4:31b-cloud
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
      keep_alive: "30m"
      max_parallel_requests: 6

  # ── ui (SciFi CLI interface) ──
  - model_name: ui
    litellm_params:
      model: openai/gemma4:31b-cloud
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
      keep_alive: "30m"
      max_parallel_requests: 6

